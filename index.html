<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <meta name="description" content="Aplicación web para consultar el clima en tiempo real utilizando la API de OpenWeather.">
    <title>Aplicación del clima / Mateo Angel</title>
</head>
<body>

<div class="contenedor">
<!-- ======================
     CABECERA
====================== -->
    <header>

        <p class="icono-app">🌤️</p>

        <h1>Aplicación del clima</h1>

        <p>Consulta el clima de cualquier ciudad</p>

    </header>

<!-- ====================
     BÚSQUEDA
====================== -->

    <main>
        <section class="busqueda">
            <input type="search" id="inputCiudad" placeholder="Escribe una ciudad..." autocomplete="off">
            <button id="btnBuscar" type="button">Buscar</button>
        </section>

<!-- ======================
     CLIMA PRINCIPAL
====================== -->
        <section class="clima-principal">
            <img id="iconoClima" src="" alt="Icono del clima">
            <h2 id="temperatura"></h2>
            <p id="ciudad"></p>
            <p id="descripcion"></p>
        </section>

<!-- ======================
     DETALLES     
====================== -->
        <section class="detalles">
            <article class="card-detalle">
                <h3>Sensación</h3>
                <p id="sensacion">Sensación térmica.</p>
            </article>
            
            <article class="card-detalle">
                <h3>Humedad</h3>
                <p id="humedad">Humedad.</p>
            </article>
            
            <article class="card-detalle">
                <h3>Viento</h3>
                <p id="viento">Velocidad del viento.</p>
            </article>
            
            <article class="card-detalle">
                <h3>Presión</h3>
                <p id="presion">Presión atmosférica.</p>
            </article>
            
            <article class="card-detalle">
                <h3>Visibilidad</h3>
                <p id="visibilidad">Visibilidad.</p>
            </article>
        </section>

<!-- ======================
     PRONÓSTICO
====================== -->
        <section class="pronostico">
<!-- Las tarjetas del pronóstico se crearán dinámicamente con JavaScript -->

            <article class="card-pronostico">
                <span class="dia">Lunes</span>
                <img src="" alt="Lluvia, despejado, soleado, nublado">
                <div class="temps">
                    <span class="max">25°C</span>
                    <span class="min">15°C</span>
                </div>
            </article> 

        </section>
    </main>


    <footer>
        <small>
            Desarrollado por Mateo Angel
        </small>
    </footer>

</div>




<script src="src/dom.js"></script>
<script src="src/storage.js"></script>
<script src="src/api.js"></script>
<script src="src/weatherService.js"></script>
<script src="src/eventListeners.js"></script>
<script src="src/ui.js"></script>
<script src="src/app.js"></script>


</body>
</html>
